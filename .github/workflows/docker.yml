name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: self-hosted

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Backend Image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/backend:latest ./backend

      - name: Build Frontend Image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/frontend:latest ./frontend

      - name: Push Backend Image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/backend:latest

      - name: Push Frontend Image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/frontend:latest

      - name: Deploy
        run: |
          docker stop backend || true
          docker rm backend || true
          docker stop frontend || true
          docker rm frontend || true

          docker pull ghcr.io/${{ github.repository_owner }}/backend:latest
          docker pull ghcr.io/${{ github.repository_owner }}/frontend:latest

          docker run -d \
            --name backend \
            -p 5000:5000 \
            ghcr.io/${{ github.repository_owner }}/backend:latest

          docker run -d \
            --name frontend \
            -p 80:80 \
            ghcr.io/${{ github.repository_owner }}/frontend:latest
